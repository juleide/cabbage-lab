appId: com.labcontrol.desktop
productName: Cabbage Lab
asar: true
beforePack: ./scripts/controller-before-pack.cjs
afterPack: ./scripts/controller-after-pack.cjs
directories:
  buildResources: resources/icons
  output: dist/installers
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/config/export.env
    to: config/export.env
  - from: resources/config/device.env.enc
    to: config/device.env.enc
  - from: resources/icons
    to: icons
    filter: ['app.png', 'app.ico']
  - from: dist/controller/lab-controller
    to: controller
mac:
  icon: resources/icons/app.icns
  target: [dmg]
win:
  icon: resources/icons/app.ico
  target: [nsis]
linux:
  icon: resources/icons/app.png
  target: [AppImage]
  category: Science
